{% extends 'base.html' %}

{% block content %}

<style>
    .image-container {
        width: 100%;
        position: relative;
    }
    .image-container img {
        width: 100%;
        display: block;
        
    }
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
    }
</style>

    <div class="container">
        <div class="row mt-5 mb-5 shadow">
            <div class="col-6 shadow p-4">
                <div class="form">
                    <h1>Logging In</h1>
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-danger">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                        <form method="post" action="{% url 'login_view' %}">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="exampleInputEmail1">Username</label>
                                <input type="text" class="form-control" id="exampleInputEmail1" name="username" aria-describedby="emailHelp">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1">Password</label>
                                <input type="password" class="form-control" id="exampleInputPassword1" name="password">
                            </div>
                            <div class="form-group form-check">
                                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                <label class="form-check-label" for="exampleCheck1">Check me out</label>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                </div>
                <p class="link">Pas encore inscrit ? <a href="{% url 'register' %}">S'inscrire</a></p>
            </div>
            <div class=" image-container col-lg-6 pt-2">
                <img src="https://c0.wallpaperflare.com/preview/402/118/398/laptop-wood-display-aerial.jpg" alt="" class="img-fluid img-responsive">
                <div class=" overlay"></div>
            </div>
        </div>
    </div>
{% endblock %}
