{% extends 'base.html' %}

{% block content %}
<div class="d-flex" style="min-height: 100vh;">
    <!-- Sidebar -->
    {% include 'administrateur/sidebar.html' %}
 
    <div class="container-fluid py-4 px-4" style="flex: 1; background-color: #f8f9fa;">
        <!-- Header -->
        <div class="mb-4">
            <h2 class="fw-bold">Bienvenue, {{ user.username}}</h2>
        </div>

        <div class="row g-4">
            <!-- afficher les articles sur le dashboard -->
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Articles</h5>
                    </div>
                    <div class="card-body">
                       <h1 class="display-4">{{ nb_articles }}</h1>
                        <p class="text-muted">Nombre total d'articles </p>
                    </div>
                </div>
            </div>

            <!-- Afficher les catégories sur le dashboard -->
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0">Catégories</h5>
                    </div>
                    <div class="card-body">
                        <h1 class="display-4">{{ nb_categories }}</h1>
                        <p class="text-muted">Nombre total de catégories</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
